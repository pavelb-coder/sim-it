<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Веб-студия · тренажёр для IT-квантума</title>
<meta name="description" content="Веб-студия в браузере: пишешь HTML и CSS, сразу видишь результат, проверка по критериям.">
<style>/* ======================= Python-класс · IT-квантум ======================= */
:root {
  --bg: #0b0e14;
  --panel: #12161f;
  --panel2: #171d29;
  --line: #242c3c;
  --text: #e7ecf6;
  --muted: #8b97ad;
  --accent: #5aa9ff;
  --green: #37d67a;
  --red: #ff6b6b;
  --yellow: #ffcc55;
  --violet: #a78bfa;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; }
code, kbd { font-family: var(--mono); font-size: 0.92em; }
a { color: var(--accent); }

/* ------------------------------- шапка ------------------------------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 18px;
  background: linear-gradient(180deg, #121722, #0d111a);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
  flex-wrap: wrap;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.01em;
  font-size: 16px;
  white-space: nowrap;
}
.logo-mark {
  width: 26px; height: 26px; border-radius: 8px;
  background: linear-gradient(135deg, #2f6df6, #7bd88f);
  display: grid; place-items: center;
  font-size: 13px; font-weight: 800; color: #fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
}
.logo small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: 0; }
.spacer { flex: 1; }
.badge {
  font-size: 11.5px;
  color: var(--muted);
  border: 1px solid var(--line);
  background: #0f141d;
  border-radius: 999px;
  padding: 3px 10px;
  white-space: nowrap;
}
.badge b { color: var(--green); font-weight: 600; }
.badge.engine { cursor: help; }
.progress-wrap { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.progress {
  width: 120px; height: 6px; border-radius: 999px; background: #1b2231; overflow: hidden;
}
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2f6df6, #37d67a); transition: width .35s ease; }
.progress-text { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.progress-text b { color: var(--text); }

/* ------------------------------- каркас ------------------------------- */
.layout {
  display: grid;
  grid-template-columns: 286px minmax(0, 1fr);
  gap: 16px;
  padding: 16px;
  align-items: start;
  max-width: 1500px;
  margin: 0 auto;
}

/* ---------------------------- список задач ---------------------------- */
.sidebar {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  position: sticky;
  top: 68px;
  max-height: calc(100vh - 92px);
  display: flex;
  flex-direction: column;
}
.sidebar-head {
  padding: 12px 14px 8px;
  font-size: 11.5px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.task-list { overflow-y: auto; padding: 8px; }
.module-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 10px 4px; margin-top: 4px;
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  border-top: 1px solid #1b2230;
}
.module-head:first-child { border-top: none; margin-top: 0; }
.module-head.active { color: var(--accent); }
.module-head .m-title { font-weight: 600; letter-spacing: .04em; }
.module-head .m-count { font-variant-numeric: tabular-nums; color: #5f6b80; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.chip {
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--muted);
  background: #0f141d;
}
.chip:empty { display: none; }
.chip.module { color: #9dc0ff; border-color: #2b4470; }
.chip.level-easy { color: #7ee0a5; border-color: rgba(55,214,122,.35); }
.chip.level-mid { color: #ffd580; border-color: rgba(255,204,85,.35); }
.chip.level-hard { color: #ff9c9c; border-color: rgba(255,107,107,.35); }
.task-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 8px 10px;
  color: var(--text);
  margin-bottom: 2px;
}
.task-item:hover:not(.locked) { background: var(--panel2); }
.task-item.active { background: #17233a; border-color: #2a4b7d; }
.task-item.locked { color: #5d6879; cursor: not-allowed; }
.task-item .num {
  flex: 0 0 22px; height: 22px; border-radius: 7px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
  background: #1b2333; color: var(--muted);
}
.task-item.done .num { background: rgba(55,214,122,.16); color: var(--green); }
.task-item.active .num { background: #2f6df6; color: #fff; }
.task-item .t-main { min-width: 0; display: block; }
.task-item .t-title { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.task-item .t-sub { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; line-height: 1.3; }
.sidebar-foot {
  border-top: 1px solid var(--line);
  padding: 10px 12px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.mini-btn {
  background: #1a2130; border: 1px solid var(--line); color: var(--muted);
  border-radius: 8px; padding: 5px 9px; font-size: 12px;
}
.mini-btn:hover { color: var(--text); border-color: #33405a; }

/* ------------------------------- рабочая ------------------------------- */
.work { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.task-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.task-head h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
.task-head .sub { color: var(--muted); font-size: 12.5px; }
.task-body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.prompt { font-size: 15px; }
.theory {
  background: #0f141d;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #c3ccdb;
}
.theory p { margin: 0 0 6px; }
.theory p:last-child { margin-bottom: 0; }
.theory code, .prompt code { background: #1b2433; border-radius: 5px; padding: 1px 5px; color: #dfe8ff; }
.examples { display: flex; gap: 10px; flex-wrap: wrap; }
.example {
  background: #0f141d; border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; font-family: var(--mono); font-size: 12.5px; min-width: 150px;
}
.example .lbl { color: var(--muted); font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.example pre { margin: 2px 0 0; white-space: pre-wrap; color: #cfe0ff; }
.example .arrow { color: var(--muted); font-family: var(--sans); font-size: 11px; margin-top: 6px; }
.hint-box {
  display: none;
  background: rgba(255,204,85,.08);
  border: 1px solid rgba(255,204,85,.3);
  color: #ffe6a8;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
}
.hint-box.show { display: block; }

/* ------------------------------- редактор ------------------------------- */
.editor-card { display: flex; flex-direction: column; }
.editor-toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px; border-bottom: 1px solid var(--line);
  background: #101620;
}
.btn {
  border-radius: 9px; border: 1px solid var(--line);
  background: #1a2130; color: var(--text);
  padding: 7px 14px; font-size: 13.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { border-color: #3a4a68; }
.btn.primary { background: linear-gradient(180deg, #2f6df6, #2559d6); border-color: #2b62e0; color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: linear-gradient(180deg, #2fbd6c, #22a05a); border-color: #26a860; color: #06220f; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); }
.btn kbd {
  background: rgba(255,255,255,.16); border-radius: 4px; padding: 0 4px; font-size: 10.5px; font-weight: 700;
}
.editor-shell {
  position: relative;
  display: flex;
  background: #0c1119;
  min-height: 250px;
  max-height: 52vh;
}
.gutter-nums {
  flex: 0 0 auto;
  white-space: pre;
  min-width: 38px;
  padding: 12px 8px 12px 10px;
  font: 14px/1.55 var(--mono);
  color: #3f4a5e;
  text-align: right;
  user-select: none;
  overflow: hidden;
  background: #0a0f16;
  border-right: 1px solid #1a2130;
}
.code-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code-hl, #code {
  position: absolute; inset: 0;
  margin: 0; padding: 12px 14px;
  font: 14px/1.55 var(--mono);
  white-space: pre; tab-size: 4;
  border: 0; overflow: auto;
}
.code-hl { color: #cbd5e6; pointer-events: none; z-index: 1; }
#code {
  color: transparent; caret-color: #fff; background: transparent;
  resize: none; outline: none; z-index: 2;
}
#code::selection { background: rgba(90,169,255,.32); }
.tok-kw { color: #c792ea; }
.tok-bi { color: #82aaff; }
.tok-str { color: #a5e075; }
.tok-num { color: #f78c6c; }
.tok-com { color: #5a6779; font-style: italic; }
.tok-def { color: #ffcb6b; }
.editor-foot {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; border-top: 1px solid var(--line); background: #101620;
}
.stdin-label { font-size: 12px; color: var(--muted); }
#stdin {
  background: #0c1119; border: 1px solid var(--line); border-radius: 8px;
  color: #cfe0ff; font: 13px/1.4 var(--mono); padding: 6px 9px; width: 190px; height: 32px; resize: vertical;
}
.hint-inline { font-size: 11.5px; color: #5f6b80; }

/* ------------------------------- консоль ------------------------------- */
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); background: #101620; }
.tab {
  background: transparent; border: 1px solid transparent; border-bottom: none;
  color: var(--muted); padding: 7px 13px; font-size: 13px; border-radius: 9px 9px 0 0;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--panel); border-color: var(--line); color: var(--text); margin-bottom: -1px; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: #38445a; }
.tab.active .dot { background: var(--accent); }
.tab .count { font-size: 11px; color: var(--muted); }
.panel { padding: 12px 14px; min-height: 150px; max-height: 40vh; overflow: auto; }
.panel[hidden] { display: none; }
.out {
  font: 13px/1.5 var(--mono);
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0;
  color: #d7e2f2;
}
.out.empty { color: #55617a; font-style: italic; }
.err {
  font: 13px/1.5 var(--mono);
  white-space: pre-wrap;
  background: rgba(255,107,107,.07);
  border: 1px solid rgba(255,107,107,.3);
  border-radius: 9px; padding: 10px 12px; color: #ffb3b3; margin-top: 10px;
}
.err b { color: var(--red); }
.test-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
  background: #0f141d; margin-bottom: 7px; font-size: 12.5px;
}
.test-row.pass { border-color: rgba(55,214,122,.35); background: rgba(55,214,122,.06); }
.test-row.fail { border-color: rgba(255,107,107,.35); background: rgba(255,107,107,.06); }
.test-row .mark { font-weight: 800; width: 14px; flex: 0 0 14px; }
.test-row.pass .mark { color: var(--green); }
.test-row.fail .mark { color: var(--red); }
.test-row .io { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.test-row .io .k { color: var(--muted); }
.test-row .io .bad { color: #ffb3b3; }
.test-row .io .good { color: #a5e075; }
.summary { font-size: 13.5px; margin-bottom: 10px; }
.summary.good { color: var(--green); }
.summary.bad { color: var(--yellow); }
.celebrate {
  margin-top: 10px; padding: 10px 12px; border-radius: 10px;
  background: rgba(55,214,122,.08); border: 1px solid rgba(55,214,122,.35);
  color: #a7f3c8; font-size: 13.5px;
}
.celebrate button { margin-top: 8px; }
.solution {
  margin-top: 10px; padding: 10px 12px; border-radius: 10px;
  background: #0c1119; border: 1px dashed #2f4364;
}
.solution .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
.solution pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; color: #cfe0ff; }
.trace-row {
  display: grid; grid-template-columns: 52px 1fr;
  gap: 10px; padding: 5px 8px; border-radius: 7px; cursor: pointer;
  border: 1px solid transparent;
}
.trace-row:hover { background: #10192a; border-color: #22304a; }
.trace-row.sel { background: #142441; border-color: #2c548f; }
.trace-line { color: var(--muted); font: 12px/1.4 var(--mono); }
.trace-body { font: 12px/1.45 var(--mono); min-width: 0; }
.trace-code { color: #8fa3c4; white-space: pre-wrap; }
.trace-vars { color: #a5e075; margin-top: 2px; white-space: pre-wrap; }
.trace-vars .none { color: #55617a; }
.foot-note { color: #4f5a6e; font-size: 11.5px; text-align: center; padding: 6px 0 22px; }

/* ------------------------------- адаптив ------------------------------- */
@media (max-width: 880px) {
  .layout { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
  .sidebar { position: static; max-height: none; }
  .task-list { display: flex; overflow-x: auto; gap: 6px; padding: 10px; }
  .task-item { flex: 0 0 auto; width: auto; max-width: 210px; margin: 0; }
  .task-item .t-sub { display: none; }
  .module-head { flex: 0 0 auto; border-top: none; margin: 0; padding: 0 8px; }
  .editor-shell { min-height: 200px; max-height: 46vh; }
  .topbar { padding: 8px 12px; }
  .progress-wrap { order: 3; width: 100%; }
  .progress { flex: 1; width: auto; }
  .panel { max-height: 46vh; }
  #stdin { width: 100%; }
  .editing-foot { display: block; }
}


/* ===================== общий каркас для продуктов ===================== */
.hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.hub-card {
  display: block; text-decoration: none; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; transition: transform .12s ease, border-color .12s ease;
}
.hub-card:hover { border-color: #35507e; }
.hub-card h3 { margin: 0 0 4px; font-size: 16px; }
.hub-card p { margin: 0; color: var(--muted); font-size: 13px; }
.hub-card .tag {
  display: inline-block; margin-top: 10px; font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: #9dc0ff; border: 1px solid #2b4470; border-radius: 999px;
  padding: 2px 9px;
}
.hub-card.soon { opacity: .55; }
.workspace { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; }
.ws-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ws-label { font-size: 12px; color: var(--muted); }
.ws-input {
  background: #0c1119; border: 1px solid var(--line); border-radius: 8px; color: #cfe0ff;
  font: 13px/1.4 var(--mono); padding: 7px 10px;
}
.ws-input:focus { outline: none; border-color: #35507e; }
.console {
  background: #0a0e15; border: 1px solid var(--line); border-radius: 10px;
  font: 13px/1.5 var(--mono); padding: 12px 14px; min-height: 260px; max-height: 46vh;
  overflow: auto; white-space: pre-wrap; word-break: break-word;
}
.console .cmd { color: #7fd1ff; }
.console .err { color: #ff9c9c; }
.console .ok { color: #a5e075; }
.console .dim { color: #5f6b80; }
.prompt-line { display: flex; gap: 8px; align-items: center; }
.prompt-line .ps1 { color: var(--green); font: 13px/1.4 var(--mono); white-space: nowrap; }
.prompt-line input {
  flex: 1; min-width: 0; background: #0a0e15; border: 1px solid var(--line); border-radius: 8px;
  color: #e7ecf6; font: 13px/1.4 var(--mono); padding: 8px 10px;
}
.prompt-line input:focus { outline: none; border-color: #35507e; }
.check-list { display: flex; flex-direction: column; gap: 6px; }
.check-item {
  display: flex; gap: 10px; align-items: flex-start; font-size: 13px;
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; background: #0f141d;
}
.check-item.pass { border-color: rgba(55,214,122,.35); background: rgba(55,214,122,.06); }
.check-item.fail { border-color: rgba(255,107,107,.35); background: rgba(255,107,107,.06); }
.check-item .mark { font-weight: 800; }
.check-item.pass .mark { color: var(--green); }
.check-item.fail .mark { color: var(--red); }
.check-item .note { color: var(--muted); font-size: 12px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 880px) { .two-col { grid-template-columns: 1fr; } }
.code-area {
  width: 100%; min-height: 130px; background: #0c1119; border: 1px solid var(--line);
  border-radius: 10px; color: #cfe0ff; font: 13px/1.5 var(--mono); padding: 10px 12px; resize: vertical;
}
.code-area:focus { outline: none; border-color: #35507e; }
.data-table { width: 100%; border-collapse: collapse; font: 12.5px/1.4 var(--mono); }
.data-table th, .data-table td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.data-table th { background: #131a26; color: #9dc0ff; font-weight: 600; }
.data-table tr:nth-child(even) td { background: rgba(255,255,255,.02); }

</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="../" style="text-decoration:none;color:#e7ecf6">
    <span class="logo-mark"></></span>
    <span>Веб-студия<small>HTML и CSS с живым превью и проверкой по критериям</small></span>
  </a>
  <div class="spacer"></div>
  <a class="badge" href="../" style="text-decoration:none">← все тренажёры</a>
  <div class="progress-wrap">
    <div class="progress"><i id="progressBar"></i></div>
    <div class="progress-text" id="progressText"></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">Задачи</div>
    <div class="task-list" id="taskList"></div>
    <div class="sidebar-foot">
      <button class="mini-btn" id="btnShowAll">Открыть все задачи</button>
      <button class="mini-btn" id="btnResetProgress">Сбросить прогресс</button>
    </div>
  </aside>

  <main class="work">
    <section class="card">
      <div class="task-head">
        <div class="chips"><span class="chip module" id="taskModule"></span><span class="chip" id="taskLevel"></span></div>
        <h1 id="taskTitle"></h1>
        <div class="sub" id="taskSub"></div>
      </div>
      <div class="task-body">
        <div class="theory" id="theory"></div>
        <div class="prompt" id="prompt"></div>
        <div class="examples" id="examples"></div>
        <div class="hint-box" id="hintBox"></div>
      </div>
    </section>

    <section class="card">
      <div class="editor-toolbar">
        <button class="btn ok" id="btnCheck">✔ Проверить</button>
        <button class="btn ghost" id="btnHint">💡 Подсказка</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="btnClean">Очистить панели</button>

      </div>
      <div class="workspace">
        <div class="two-col">
  <div>
    <div class="ws-label" style="margin-bottom:4px">HTML</div>
    <textarea class="code-area" id="htmlCode" spellcheck="false" style="min-height:150px"></textarea>
    <div class="ws-label" style="margin:10px 0 4px">CSS</div>
    <textarea class="code-area" id="cssCode" spellcheck="false" style="min-height:110px"></textarea>

<script>/* ==========================================================================
   Shell — общий каркас тренажёров IT-квантума.
   Даёт: список задач с прогрессом, карточку задания, кнопку проверки,
   подсказку, разбор результатов и хранение прогресса в браузере.
   Продукт подключает свои задачи и две функции: open(task) и check(task).
   ========================================================================== */
(function (global) {
  'use strict';

  var cfg = null;
  var st = { solved: {}, current: 0, showAll: false };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function save() {
    try { localStorage.setItem(cfg.storageKey, JSON.stringify(st)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(cfg.storageKey);
      if (!raw) return;
      var d = JSON.parse(raw);
      st.solved = d.solved || {};
      st.showAll = !!d.showAll;
    } catch (e) {}
  }
  function tasks() { return cfg.tasks; }
  function task(i) { return cfg.tasks[i]; }
  function unlocked(i) { return st.showAll || i === 0 || !!st.solved[cfg.tasks[i - 1].id]; }
  function solvedCount() {
    var n = 0;
    cfg.tasks.forEach(function (t) { if (st.solved[t.id]) n++; });
    return n;
  }

  function renderSidebar() {
    var html = '';
    cfg.tasks.forEach(function (t, i) {
      var done = !!st.solved[t.id];
      var lock = !unlocked(i);
      html += '<button class="task-item' + (i === st.current ? ' active' : '') + (done ? ' done' : '') +
        (lock ? ' locked' : '') + '" data-i="' + i + '">' +
        '<span class="num">' + (done ? '✓' : (lock ? '🔒' : (i + 1))) + '</span>' +
        '<span class="t-main"><span class="t-title">' + esc(t.title) + '</span>' +
        '<span class="t-sub">' + esc(t.subtitle || '') + '</span></span></button>';
    });
    $('taskList').innerHTML = html;
    Array.prototype.forEach.call($('taskList').querySelectorAll('.task-item'), function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.getAttribute('data-i'), 10);
        if (unlocked(i)) openTask(i);
      });
    });
  }

  function renderProgress() {
    var n = solvedCount();
    $('progressBar').style.width = (n / cfg.tasks.length * 100) + '%';
    $('progressText').innerHTML = '<b>' + n + '</b> из ' + cfg.tasks.length + ' задач';
  }

  function openTask(i) {
    st.current = i;
    var t = tasks()[i];
    $('taskTitle').textContent = t.title;
    $('taskSub').textContent = t.subtitle || '';
    $('taskModule').textContent = cfg.productTitle || '';
    var lvl = $('taskLevel');
    if (t.level) {
      lvl.textContent = t.level;
      lvl.className = 'chip level-' + (t.level === 'легко' ? 'easy' : t.level === 'средне' ? 'mid' : 'hard');
    } else { lvl.textContent = ''; lvl.className = 'chip'; }

    $('theory').innerHTML = t.theory || '';
    $('prompt').innerHTML = t.prompt || '';
    var ex = '';
    (t.examples || []).forEach(function (e) {
      ex += '<div class="example"><div class="lbl">' + esc(e.label || 'пример') + '</div><pre>' + esc(e.text) + '</pre></div>';
    });
    $('examples').innerHTML = ex;
    var hint = $('hintBox');
    hint.textContent = t.hint || 'Подсказки нет — попробуй сам.';
    hint.classList.remove('show');

    $('panel-check').innerHTML = '<pre class="out empty">Пока пусто. Выполни задание в рабочей области и нажми «Проверить».</pre>';
    if (cfg.open) cfg.open(t, st);
    renderSidebar();
    renderProgress();
    save();
  }

  function runCheck() {
    var t = tasks()[st.current];
    var results;
    try {
      results = cfg.check(t, st) || [];
    } catch (e) {
      results = [{ ok: false, label: 'Ошибка проверки: ' + (e && e.message ? e.message : e) }];
    }
    var passed = results.filter(function (r) { return r.ok; }).length;
    var allOk = results.length > 0 && passed === results.length;

    var html = '';
    html += allOk
      ? '<div class="summary good">✔ Готово: все ' + results.length + ' проверок пройдены.</div>'
      : '<div class="summary bad">Пройдено ' + passed + ' из ' + results.length + ' проверок. Ниже видно, что именно не так.</div>';
    html += '<div class="check-list">';
    results.forEach(function (r) {
      html += '<div class="check-item ' + (r.ok ? 'pass' : 'fail') + '">' +
        '<span class="mark">' + (r.ok ? '✔' : '✕') + '</span><div>' + esc(r.label) +
        (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '') + '</div></div>';
    });
    html += '</div>';

    if (allOk) {
      var first = !st.solved[t.id];
      st.solved[t.id] = true;
      save();
      if (first) html += '<div class="celebrate">Задача закрыта — прогресс сохранён.</div>';
      if (st.current + 1 < tasks().length) {
        html += '<div class="celebrate"><button class="btn ok" id="goNext">Следующая задача →</button></div>';
      } else {
        html += '<div class="celebrate"><b>Это последняя задача продукта.</b> Возвращайся на главную и пробуй другой тренажёр.</div>';
      }
      renderSidebar();
      renderProgress();
    }
    $('panel-check').innerHTML = html;
    var next = $('goNext');
    if (next) next.addEventListener('click', function () { openTask(st.current + 1); });
    $('panel-check').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function init(config) {
    cfg = config;
    load();
    if ($('productTitle')) $('productTitle').textContent = cfg.productTitle || '';
    if ($('productSub')) $('productSub').textContent = cfg.productSubtitle || '';

    $('btnCheck').addEventListener('click', runCheck);
    $('btnHint').addEventListener('click', function () { $('hintBox').classList.toggle('show'); });
    $('btnShowAll').addEventListener('click', function () {
      st.showAll = !st.showAll;
      save();
      this.textContent = st.showAll ? 'Обычный режим' : 'Открыть все задачи';
      renderSidebar();
    });
    $('btnResetProgress').addEventListener('click', function () {
      if (!confirm('Сбросить прогресс продукта?')) return;
      st.solved = {};
      st.showAll = false;
      save();
      $('btnShowAll').textContent = 'Открыть все задачи';
      openTask(0);
    });
    $('btnShowAll').textContent = st.showAll ? 'Обычный режим' : 'Открыть все задачи';

    var start = 0;
    for (var i = 0; i < tasks().length; i++) { if (!st.solved[tasks()[i].id]) { start = i; break; } }
    openTask(unlocked(start) ? start : 0);
    if (cfg.onReady) cfg.onReady(st);
  }

  global.Shell = {
    init: init,
    state: st,
    openTask: openTask,
    runCheck: runCheck,
    unlocked: unlocked,
    esc: esc,
    save: save
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

      solution: {

             '@media (max-width: 600px) { .row { flex-direction: column; } }'

            return cssHas(css, /\.row\s*\{[^}]*display\s*:\s*flex/) && cssHas(css, /\.row\s*\{[^}]*gap\s*:/);
          }
        },
        {
          label: 'есть @media (max-width …) с flex-direction: column',
          fn: function (html, css) {
            return /@media[^{]*max-width[^{]*\{[\s\S]*flex-direction\s*:\s*column/i.test(String(css));
          }
        }
      ]
    }
  ];
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ==========================================================================

(function () {

  var state = { html: '', css: '' };

  function doc() {
    return '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><style>' +
      'body{font:15px/1.5 system-ui,sans-serif;margin:14px;color:#111;background:#fff}' +
      state.css + '</style></head><body>' + state.html + '</body></html>';
  }

  var timer = null;
  function update() {
    state.html = $('htmlCode').value;
    state.css = $('cssCode').value;
    clearTimeout(timer);
    timer = setTimeout(function () {
      $('preview').srcdoc = doc();
      var tags = (state.html.match(/<([a-z][a-z0-9-]*)/gi) || []).length;
      $('previewStatus').textContent = 'тегов: ' + tags + ' · CSS-правил: ' +
        ((state.css.match(/\{/g) || []).length);
    }, 200);
  }

  window.WEBAPI = {
    html: function () { return $('htmlCode').value; },
    css: function () { return $('cssCode').value; }
  };

  document.addEventListener('DOMContentLoaded', function () {
    ['htmlCode', 'cssCode'].forEach(function (id) {
      $(id).addEventListener('input', update);
    });

    $('btnClean').addEventListener('click', function () {
      if (!confirm('Очистить обе панели?')) return;
      $('htmlCode').value = '';
      $('cssCode').value = '';
      update();
    });

    window.Shell.init({
      storageKey: 'web.v1',
      productTitle: 'Веб-студия',
      productSubtitle: 'HTML, CSS и живое превью',
      tasks: window.WEB_TASKS,
      open: function (task) {
        $('htmlCode').value = task.starter ? task.starter.html : '';
        $('cssCode').value = task.starter ? task.starter.css : '';
        update();
      },
      check: function (task) {
        var html = $('htmlCode').value, css = $('cssCode').value;
        return task.checks.map(function (c) {
          var ok = false;
          try { ok = !!c.fn(html, css); } catch (e) { ok = false; }
          return { ok: ok, label: c.label };
        });
      }
    });

    window.__solve = function (i) {
      var s = window.WEB_TASKS[i].solution;
      $('htmlCode').value = s.html;
      $('cssCode').value = s.css;
      update();
    };
  });
})();
</script>
</body>
</html>
